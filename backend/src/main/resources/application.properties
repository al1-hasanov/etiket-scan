spring.application.name=etiket
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/etiket;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.threads.virtual.enabled=true
off.base-url=${OFF_BASE_URL:https://world.openfoodfacts.org}
off.user-agent=${OFF_USER_AGENT:EtiketDemo/0.2 (local-development; read-only)}
off.enabled=${OFF_ENABLED:false}
off.timeout-seconds=8
off.cache-hours=24
logging.level.org.springframework.web=INFO
