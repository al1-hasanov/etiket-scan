spring.application.name=etiket
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/etiket;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.threads.virtual.enabled=true
off.base-url=${OFF_BASE_URL:https://world.openfoodfacts.org}
off.user-agent=${OFF_USER_AGENT:Etiket/0.7.1 (https://github.com/al1-hasanov/etiket-scan)}
off.enabled=${OFF_ENABLED:false}
off.timeout-seconds=8
off.cache-hours=${OFF_CACHE_HOURS:24}
off.miss-cache-hours=${OFF_MISS_CACHE_HOURS:6}
off.stale-cache-days=${OFF_STALE_CACHE_DAYS:7}
off.cooldown-seconds=${OFF_COOLDOWN_SECONDS:15}
off.min-interval-millis=${OFF_MIN_INTERVAL_MILLIS:5000}
logging.level.org.springframework.web=INFO
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=9MB
review.username=${REVIEW_ADMIN_USERNAME:reviewer}
review.password=${REVIEW_ADMIN_PASSWORD:}
submissions.max-total=${SUBMISSIONS_MAX_TOTAL:100}
submissions.max-pending=${SUBMISSIONS_MAX_PENDING:25}
server.tomcat.max-swallow-size=9MB
ocr.enabled=${OCR_ENABLED:true}
ocr.command=${OCR_COMMAND:tesseract}
ocr.timeout-seconds=35
ocr.max-jobs=${OCR_MAX_JOBS:200}
ocr.max-pending=${OCR_MAX_PENDING:8}
ocr.diagnostics=${OCR_DIAGNOSTICS:false}
