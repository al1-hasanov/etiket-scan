name: Backend CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install OCR engine for integration checks
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-aze tesseract-ocr-tur tesseract-ocr-rus tesseract-ocr-eng tesseract-ocr-deu

      - name: Test and build backend
        env:
          ETIKET_OCR_ENGINE_TEST: "true"
        run: bash ./gradlew --no-daemon -PbackendOnly :core:test :backend:test :backend:bootJar
