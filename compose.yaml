services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: etiket
      POSTGRES_USER: etiket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etiket_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - etiket_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etiket -d etiket"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/etiket
      DB_USERNAME: etiket
      DB_PASSWORD: ${DB_PASSWORD:-etiket_local_only}
      OFF_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  etiket_postgres:
